<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 534" width="800" height="534">
  <defs>
    <linearGradient id="wellbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e1b"/>
      <stop offset="50%" stop-color="#232b26"/>
      <stop offset="100%" stop-color="#121614"/>
    </linearGradient>
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e69c5e"/>
      <stop offset="100%" stop-color="#a85e2b"/>
    </linearGradient>
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73a888"/>
      <stop offset="100%" stop-color="#3c6b4e"/>
    </linearGradient>
    <linearGradient id="softSand" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d9c2a7"/>
      <stop offset="100%" stop-color="#f5ede3"/>
    </linearGradient>
    <pattern id="hexGrid" width="30" height="52" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 30 9 L 30 26 L 15 35 L 0 26 L 0 9 Z M 15 35 L 30 44 L 30 61 L 15 70 L 0 61 L 0 44 Z" fill="none" stroke="rgba(115, 168, 136, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="534" fill="url(#wellbg)"/>
  <rect width="800" height="534" fill="url(#hexGrid)"/>

  <!-- Geometric Concentric Aura of Care & Connection -->
  <circle cx="400" cy="267" r="220" fill="none" stroke="url(#emeraldTeal)" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.4"/>
  <circle cx="400" cy="267" r="170" fill="none" stroke="url(#warmAmber)" stroke-width="1" stroke-dasharray="5 7" opacity="0.5"/>
  <circle cx="400" cy="267" r="120" fill="none" stroke="url(#softSand)" stroke-width="1" opacity="0.3"/>

  <!-- Geometric Faceted Supportive Figures / Interlocking Community Shield -->
  <g transform="translate(400, 267)">
    <!-- Central Geometric Lotus / Shield of Wellbeing -->
    <!-- Base leaf left -->
    <polygon points="0,50 -90,10 -130,-70 -30,-40" fill="url(#emeraldTeal)" opacity="0.9"/>
    <!-- Base leaf right -->
    <polygon points="0,50 90,10 130,-70 30,-40" fill="#2d523c" opacity="0.9"/>
    <!-- Center sprout -->
    <polygon points="0,-120 -40,-40 0,50" fill="url(#warmAmber)" opacity="0.95"/>
    <polygon points="0,-120 40,-40 0,50" fill="#914d1e" opacity="0.95"/>
    <!-- Top inner core facet -->
    <polygon points="0,-120 -25,-170 0,-150 25,-170" fill="url(#softSand)"/>

    <!-- Interconnected Student Nodes (Geometric Network) -->
    <!-- Node Left (Mentor) -->
    <line x1="-130" y1="-70" x2="-220" y2="-120" stroke="url(#warmAmber)" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="-220" cy="-120" r="16" fill="url(#warmAmber)"/>
    <circle cx="-220" cy="-120" r="24" fill="none" stroke="url(#warmAmber)" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="-220,-160 -190,-120 -250,-120" fill="#a85e2b" opacity="0.4"/>

    <!-- Node Right (Peer Supporter) -->
    <line x1="130" y1="-70" x2="220" y2="-120" stroke="url(#emeraldTeal)" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="220" cy="-120" r="16" fill="url(#emeraldTeal)"/>
    <circle cx="220" cy="-120" r="24" fill="none" stroke="url(#emeraldTeal)" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="220,-160 250,-120 190,-120" fill="#3c6b4e" opacity="0.4"/>

    <!-- Node Bottom (Support Desk / Safe Space) -->
    <line x1="0" y1="50" x2="0" y2="140" stroke="url(#softSand)" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="0" cy="140" r="18" fill="url(#softSand)"/>
    <polygon points="0,110 30,140 0,170 -30,140" fill="#3c6b4e" opacity="0.7"/>

    <!-- Subtle Connection Lines -->
    <line x1="-220" y1="-120" x2="0" y2="-150" stroke="#73a888" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>
    <line x1="220" y1="-120" x2="0" y2="-150" stroke="#73a888" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>
    <line x1="-220" y1="-120" x2="0" y2="140" stroke="#d9c2a7" stroke-width="1" stroke-dasharray="6 4" opacity="0.4"/>
    <line x1="220" y1="-120" x2="0" y2="140" stroke="#d9c2a7" stroke-width="1" stroke-dasharray="6 4" opacity="0.4"/>
  </g>

  <!-- Polygonal Geometric Framing -->
  <polygon points="40,40 100,40 40,100" fill="none" stroke="url(#emeraldTeal)" stroke-width="1.5"/>
  <polygon points="760,40 700,40 760,100" fill="none" stroke="url(#warmAmber)" stroke-width="1.5"/>
  <polygon points="40,494 100,494 40,434" fill="none" stroke="url(#warmAmber)" stroke-width="1.5"/>
  <polygon points="760,494 700,494 760,434" fill="none" stroke="url(#emeraldTeal)" stroke-width="1.5"/>

  <!-- Vector Header & Typography -->
  <text x="400" y="55" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="14" letter-spacing="5" fill="#f5ede3" opacity="0.95">STUDENT WELLBEING &amp; PEER SUPPORT</text>
  <text x="400" y="78" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="11" letter-spacing="3" fill="#73a888" opacity="0.85">PPG INSTITUTE OF TECHNOLOGY • CONFIDENTIAL &amp; CARING • 2026</text>

  <!-- Footer Banner -->
  <text x="400" y="490" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="12" letter-spacing="4" fill="#d9c2a7" opacity="0.8">A SAFE SPACE FOR EVERY VOICE, EVERY DAY</text>
</svg>
