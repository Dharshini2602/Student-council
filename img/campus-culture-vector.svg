<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 467" width="700" height="467">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241b15"/>
      <stop offset="50%" stop-color="#30231b"/>
      <stop offset="100%" stop-color="#18130f"/>
    </linearGradient>
    <linearGradient id="prism1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0965d"/>
      <stop offset="100%" stop-color="#ad502a"/>
    </linearGradient>
    <linearGradient id="prism2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d6ba"/>
      <stop offset="50%" stop-color="#d4b294"/>
      <stop offset="100%" stop-color="#a47d5e"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd59e"/>
      <stop offset="100%" stop-color="#d48c3f"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="rgba(240, 150, 93, 0.12)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="700" height="467" fill="url(#bgGrad2)"/>
  <rect width="700" height="467" fill="url(#dotGrid)"/>

  <!-- Geometric Rays / Stage Lights -->
  <polygon points="350,0 200,467 260,467" fill="url(#goldBright)" opacity="0.12"/>
  <polygon points="350,0 320,467 380,467" fill="url(#prism1)" opacity="0.15"/>
  <polygon points="350,0 440,467 500,467" fill="url(#goldBright)" opacity="0.12"/>

  <!-- Large Central Prismatic Star / Origami Gem Structure -->
  <g transform="translate(350, 220)">
    <!-- Central Polyhedron -->
    <polygon points="0,-130 95,-45 0,35" fill="url(#prism1)" opacity="0.9"/>
    <polygon points="0,-130 -95,-45 0,35" fill="#753517" opacity="0.95"/>
    <polygon points="-95,-45 0,35 -60,115" fill="url(#prism2)" opacity="0.85"/>
    <polygon points="95,-45 0,35 60,115" fill="url(#goldBright)" opacity="0.85"/>
    <polygon points="0,35 -60,115 0,150 60,115" fill="#502814" opacity="0.9"/>

    <!-- Wing facets -->
    <polygon points="95,-45 160,-20 135,50 60,115" fill="#964b24" opacity="0.75"/>
    <polygon points="-95,-45 -160,-20 -135,50 -60,115" fill="#ba6334" opacity="0.75"/>
    <polygon points="0,-130 95,-45 160,-20 70,-110" fill="url(#goldBright)" opacity="0.6"/>
    <polygon points="0,-130 -95,-45 -160,-20 -70,-110" fill="url(#prism2)" opacity="0.6"/>

    <!-- Sound & Pulse Rings -->
    <circle cx="0" cy="10" r="160" fill="none" stroke="url(#prism1)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>
    <circle cx="0" cy="10" r="195" fill="none" stroke="url(#goldBright)" stroke-width="1" stroke-dasharray="3 7" opacity="0.4"/>

    <!-- Geometric Icons: Megaphone, Book, Compass -->
    <g transform="translate(-140, -110)">
      <polygon points="0,0 24,-12 24,12" fill="url(#goldBright)"/>
      <rect x="24" y="-8" width="12" height="16" fill="url(#prism2)"/>
      <polygon points="36,-4 42,-8 42,8 36,4" fill="url(#prism1)"/>
    </g>

    <g transform="translate(140, -110)">
      <polygon points="0,-16 14,0 0,16 -14,0" fill="url(#goldBright)"/>
      <circle cx="0" cy="0" r="4" fill="#241b15"/>
    </g>
  </g>

  <!-- Geometric Floor & Perspective Grid -->
  <polygon points="0,467 700,467 520,380 180,380" fill="#1b140f" opacity="0.85"/>
  <line x1="0" y1="467" x2="180" y2="380" stroke="#d48c3f" stroke-width="1.5" opacity="0.4"/>
  <line x1="700" y1="467" x2="520" y2="380" stroke="#d48c3f" stroke-width="1.5" opacity="0.4"/>
  <line x1="230" y1="467" x2="290" y2="380" stroke="#d48c3f" stroke-width="1" opacity="0.25"/>
  <line x1="470" y1="467" x2="410" y2="380" stroke="#d48c3f" stroke-width="1" opacity="0.25"/>
  <line x1="350" y1="467" x2="350" y2="380" stroke="#d48c3f" stroke-width="1" opacity="0.3"/>

  <!-- Bold Vector Geometric Badges / Accents -->
  <rect x="30" y="30" width="120" height="28" fill="#1b140f" stroke="url(#goldBright)" stroke-width="1"/>
  <text x="90" y="49" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="11" letter-spacing="3" fill="#ffd59e">PPGIT 2026</text>

  <rect x="550" y="30" width="120" height="28" fill="#1b140f" stroke="url(#prism1)" stroke-width="1"/>
  <text x="610" y="49" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="11" letter-spacing="3" fill="#f5d6ba">CULTURE &amp; ARTS</text>

  <text x="350" y="440" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="13" letter-spacing="4" fill="#d4b294" opacity="0.9">CAMPUS CELEBRATIONS • VOICES • EXPRESSION</text>
</svg>
