<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 667" width="1000" height="667">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1a16"/>
      <stop offset="50%" stop-color="#2a221b"/>
      <stop offset="100%" stop-color="#14110e"/>
    </linearGradient>
    <linearGradient id="polyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d98c59" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8c5940" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="polyGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e5c7a9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c0a68c" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c68a4c"/>
      <stop offset="50%" stop-color="#e2b078"/>
      <stop offset="100%" stop-color="#ffd59e"/>
    </linearGradient>
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6b6c"/>
      <stop offset="100%" stop-color="#2c3e3f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(217, 140, 89, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="667" fill="url(#bgGrad)"/>
  <rect width="1000" height="667" fill="url(#grid)"/>

  <!-- Geometric Abstract Backing Shapes -->
  <circle cx="500" cy="333" r="260" fill="none" stroke="url(#polyGrad1)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="500" cy="333" r="200" fill="none" stroke="url(#polyGrad2)" stroke-width="1.5" opacity="0.4"/>
  <circle cx="500" cy="333" r="140" fill="none" stroke="#e5c7a9" stroke-width="1" stroke-dasharray="4 8" opacity="0.5"/>

  <!-- Angular faceted polygonal landscape / council forum -->
  <polygon points="100,667 300,480 500,560 250,667" fill="#2d2219" opacity="0.7"/>
  <polygon points="500,560 700,490 900,667 400,667" fill="#241b14" opacity="0.8"/>
  <polygon points="250,480 500,360 750,480 500,560" fill="url(#polyGrad1)" opacity="0.25"/>

  <!-- Modern Geometric Council Collaboration Table -->
  <g transform="translate(160, 80)">
    <!-- Central Isometric Podium / Table -->
    <polygon points="340,340 480,270 340,200 200,270" fill="url(#polyGrad2)"/>
    <polygon points="200,270 340,340 340,430 200,360" fill="url(#polyGrad1)"/>
    <polygon points="480,270 340,340 340,430 480,360" fill="#6d432e"/>

    <!-- Geometric Tech & Idea Nodes on table -->
    <polygon points="340,240 370,255 340,270 310,255" fill="url(#goldGrad)" filter="url(#glow)"/>
    <line x1="340" y1="200" x2="340" y2="120" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="340" cy="110" r="12" fill="url(#goldGrad)"/>
    <polygon points="340,102 346,115 334,115" fill="#1f1a16"/>

    <!-- Stylized Geometric Student Figure 1 (Left - President/Leader) -->
    <g>
      <circle cx="160" cy="220" r="22" fill="url(#goldGrad)"/>
      <polygon points="160,250 205,340 115,340" fill="url(#polyGrad1)"/>
      <polygon points="160,250 175,340 115,340" fill="#5c3825"/>
      <polygon points="180,280 230,295 210,315 175,295" fill="url(#polyGrad2)"/>
    </g>

    <!-- Stylized Geometric Student Figure 2 (Right - Vice President/Coordinator) -->
    <g>
      <circle cx="520" cy="220" r="22" fill="url(#polyGrad2)"/>
      <polygon points="520,250 565,340 475,340" fill="url(#polyGrad1)"/>
      <polygon points="520,250 535,340 565,340" fill="#4d3020"/>
      <polygon points="500,280 450,295 470,315 505,295" fill="url(#goldGrad)"/>
    </g>

    <!-- Stylized Geometric Student Figure 3 (Top / Strategist) -->
    <g>
      <circle cx="340" cy="150" r="18" fill="url(#polyGrad1)"/>
      <polygon points="340,175 380,240 300,240" fill="url(#tealAccent)"/>
      <polygon points="340,175 350,240 380,240" fill="#1e2c2d"/>
    </g>

    <!-- Stylized Geometric Student Figure 4 (Foreground / Delegate) -->
    <g>
      <circle cx="340" cy="410" r="24" fill="url(#goldGrad)"/>
      <polygon points="340,440 400,530 280,530" fill="url(#polyGrad2)"/>
      <polygon points="340,440 360,530 400,530" fill="#9e846e"/>
    </g>

    <!-- Isometric Data & Blueprint Lines -->
    <path d="M 60,180 L 140,220 L 200,270" fill="none" stroke="#d98c59" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
    <path d="M 620,180 L 540,220 L 480,270" fill="none" stroke="#e5c7a9" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>

    <!-- Polygonal Holographic Charts & Documents -->
    <polygon points="120,160 170,140 180,180 130,200" fill="url(#goldGrad)" opacity="0.4"/>
    <polygon points="510,160 560,140 570,180 520,200" fill="url(#tealAccent)" opacity="0.5"/>
  </g>

  <!-- Dynamic Geometric Framing & Accents -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.7">
    <polygon points="40,40 80,40 40,80"/>
    <polygon points="960,40 920,40 960,80"/>
    <polygon points="40,627 80,627 40,587"/>
    <polygon points="960,627 920,627 960,587"/>
    <line x1="90" y1="40" x2="260" y2="40" stroke-dasharray="4 6"/>
    <line x1="740" y1="40" x2="910" y2="40" stroke-dasharray="4 6"/>
  </g>

  <!-- Typography / Crest Banner Vector -->
  <text x="500" y="75" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="15" letter-spacing="6" fill="#e5c7a9" opacity="0.9">PPG INSTITUTE OF TECHNOLOGY</text>
  <text x="500" y="98" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="400" font-size="11" letter-spacing="4" fill="#c68a4c" opacity="0.8">STUDENT COUNCIL • COLLABORATION &amp; LEADERSHIP • 2026</text>
</svg>
